# SPEX auto-implement workflow.
#
# When an issue is labelled `spex:implement`, SPEX implements it on a new
# branch and opens a PR.
#
# Install source: SPEX is not on npm yet, so this workflow clones the
# public repo `rogcg/spex` and builds from source. Once SPEX is published,
# this entire "Checkout SPEX source" + "Setup pnpm" + "Install + build"
# block can be replaced with a single `npm install -g spex` step.
#
# Requirements:
#   - Repo label `spex:implement` (create it once in the GitHub UI).
#   - Repo secret ANTHROPIC_API_KEY — used by SPEX to call Claude.
#   - Default GITHUB_TOKEN — already provided by GitHub Actions; the workflow
#     uses it to push the branch and open the PR.
#   - `.ai/config.yaml` with `integrations.github.{owner, repo, auto_create_pr: true}`
#     for the PR to actually open (otherwise SPEX commits locally and stops).
#   - Settings → Actions → General → "Allow GitHub Actions to create and
#     approve pull requests" must be ENABLED. Without it, the branch is
#     pushed but PR creation fails with "GitHub Actions is not permitted to
#     create or approve pull requests."
#
# Customise:
#   - `SPEX_REF` env at the top pins which SPEX version this workflow uses.
#     Default `main` tracks head; set to a tag (e.g. `v0.5.0`) for stability.
#
# Limitations:
#   - This workflow uses the issue TITLE as the feature description. Full
#     title+body parsing arrives with `spex implement --from-issue`.
#   - `--auto` skips the per-step approval gates. Review the resulting PR
#     before merging.

name: SPEX Implement from Issue

on:
  issues:
    types: [labeled]

env:
  SPEX_REPO: rogcg/spex
  SPEX_REF: main

jobs:
  implement:
    if: github.event.label.name == 'spex:implement'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout SPEX source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SPEX_REPO }}
          ref: ${{ env.SPEX_REF }}
          path: .spex-source

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: .spex-source/pnpm-lock.yaml

      - name: Install + build SPEX
        working-directory: .spex-source
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build

      - name: Hide SPEX source from target repo git status
        # spex implement runs `git status --porcelain` to confirm a clean
        # working tree. The .spex-source/ checkout above is untracked in the
        # target repo and would trip that check. Add it to .git/info/exclude
        # so git status ignores it without modifying the user's .gitignore.
        run: echo ".spex-source/" >> .git/info/exclude

      - name: Configure git identity
        run: |
          git config user.name "spex-bot"
          git config user.email "spex-bot@users.noreply.github.com"

      - name: Run implement
        run: node "$GITHUB_WORKSPACE/.spex-source/packages/cli/dist/index.js" implement "${{ github.event.issue.title }}" --auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
